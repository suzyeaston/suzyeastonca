<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suzy Pirate Radio · Local receiver</title><style>body{font:18px/1.6 system-ui;max-width:700px;margin:12vh auto;padding:24px;background:#0c171b;color:#e9f5ec}h1{font-size:48px;line-height:1.1}button{padding:14px;background:#bbff54;color:#122019;border:0;border-radius:8px;font:700 18px system-ui}audio{width:100%}#status{color:#bbff54}</style><p>INDEPENDENT INTERNET RADIO</p><h1>Suzy Pirate Radio.</h1><p id="status" role="status">Checking transmitter…</p><p>Click Tune in once your transmitter is sending audio. This is your local test receiver.</p><button id="play">Tune in / retry</button><p id="playback" role="status">Stopped</p><audio id="audio" controls preload="none"></audio><script>
const audio=document.getElementById('audio'),status=document.getElementById('status'),playback=document.getElementById('playback');
document.getElementById('play').onclick=()=>{audio.src='/live.mp3';playback.textContent='Connecting…';audio.play().catch(()=>playback.textContent='Unable to play. Check the transmitter, then retry.');};
for(const [event,label] of [['playing','Playing'],['waiting','Buffering…'],['pause','Paused'],['ended','Broadcast ended'],['error','No playable stream. Check the transmitter, then retry.']])audio.addEventListener(event,()=>playback.textContent=label);
async function poll(){try{const r=await fetch('/status.json',{cache:'no-store',signal:AbortSignal.timeout(5000)});const s=await r.json();status.textContent=s.online?'TRANSMITTER ONLINE · '+s.listeners+' listeners':'OFF AIR · Start your transmitter';}catch(_){status.textContent='Relay unavailable';}}poll();setInterval(poll,5000);
</script></html>
