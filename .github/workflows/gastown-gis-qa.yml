name: Gastown GIS QA

on:
  pull_request:
    paths:
      - 'scripts/rebuild-gastown-civic-world.js'
      - 'scripts/generate-gastown-world.js'
      - 'js/gastown-sim.js'
      - 'page-home.php'
      - 'parts/home-gastown-spotlight.php'
      - 'assets/illustrations/gastown-station-east-lookout.svg'
      - 'parts/home-feature-previews.php'
      - 'assets/css/home-feature-previews.css'
      - 'js/gastown-waterfront-station.js'
      - 'js/gastown-waterfront-places.js'
      - 'js/gastown-suzy-avatar.js'
      - 'js/gastown-harbour-vista.js'
      - 'js/gastown-cordova-architecture.js'
      - 'page-gastown-sim.php'
      - 'assets/css/gastown-sim.css'
      - 'functions.php'
      - 'assets/world/**'
      - 'assets/audio/gastown/**'
      - 'assets/audio/yvr/**'
      - 'data/cov/**'
      - 'data/reference/**'
      - '__tests__/gastown-*.test.js'
  push:
    branches: [main]
    paths:
      - 'scripts/rebuild-gastown-civic-world.js'
      - 'scripts/generate-gastown-world.js'
      - 'js/gastown-sim.js'
      - 'page-home.php'
      - 'parts/home-gastown-spotlight.php'
      - 'assets/illustrations/gastown-station-east-lookout.svg'
      - 'parts/home-feature-previews.php'
      - 'assets/css/home-feature-previews.css'
      - 'js/gastown-waterfront-station.js'
      - 'js/gastown-waterfront-places.js'
      - 'js/gastown-suzy-avatar.js'
      - 'js/gastown-harbour-vista.js'
      - 'js/gastown-cordova-architecture.js'
      - 'page-gastown-sim.php'
      - 'assets/css/gastown-sim.css'
      - 'functions.php'
      - 'assets/world/**'
      - 'assets/audio/gastown/**'
      - 'assets/audio/yvr/**'
      - 'data/cov/**'
      - 'data/reference/**'
      - '__tests__/gastown-audio-assets.test.js'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/rebuild-gastown-civic-world.js
          node --check scripts/generate-gastown-world.js
          node --check js/gastown-waterfront-station.js
          node --check js/gastown-sim.js
          node --check js/gastown-harbour-vista.js
          node --check js/gastown-cordova-architecture.js
          node --check js/gastown-waterfront-places.js
          node --check js/gastown-suzy-avatar.js
          node --check js/gastown-street-life.js
      - name: Validate civic route, station, and runtime geometry
        run: |
          node --test __tests__/gastown-gis-alignment.test.js
          node --test __tests__/gastown-waterfront-public-realm.test.js
          node --test __tests__/gastown-harbour-vista.test.js
          node --test __tests__/gastown-harbour-v3-regression.test.js
          node --test __tests__/gastown-parking-lookout.test.js
          node --test __tests__/gastown-station-east-v2.test.js
          node --test __tests__/gastown-suzy-film-avatar.test.js
          node --test __tests__/gastown-cordova-architecture.test.js
          node --test __tests__/gastown-storefront-home.test.js
          node --test __tests__/home-gastown-lookout.test.js
          node --test __tests__/gastown-waterfront-station.test.js
          node --test __tests__/gastown-sim-config.test.js
          node --test __tests__/gastown-audio-assets.test.js
          node --test __tests__/gastown-street-life.test.js
          node --test __tests__/gastown-film-camera-scene.test.js
          node --test __tests__/gastown-film-scene-v11.test.js
          node --test __tests__/gastown-sprite-raycast-safety.test.js
          node --test __tests__/gastown-trolley-scene-controls.test.js
          node --test __tests__/gastown-sidebar-local-dialogue.test.js
          node --test __tests__/gastown-photo-look-review-dialogue.test.js
