name: Publish Meanwhile to WordPress

# Publishing is deliberately separate from the existing theme/plugin deploy.
# Only trusted main-branch commits get access to production SSH secrets.
on:
  pull_request:
    paths:
      - 'content/meanwhile/**'
      - 'scripts/publish_meanwhile.py'
      - 'scripts/build_toaster_part2_media.py'
      - 'scripts/wp_publish_meanwhile.php'
      - 'scripts/wp_verify_meanwhile_order.php'
      - '.github/workflows/publish-meanwhile.yml'
  push:
    branches:
      - main
    paths:
      - 'content/meanwhile/**'
      - 'scripts/publish_meanwhile.py'
      - 'scripts/build_toaster_part2_media.py'
      - 'scripts/wp_publish_meanwhile.php'
      - 'scripts/wp_verify_meanwhile_order.php'
      - '.github/workflows/publish-meanwhile.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Only publish this article slug (blank = all ready articles)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-meanwhile-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install --disable-pip-version-check "Markdown>=3.7,<4" "PyYAML>=6,<7" "paramiko>=3.4,<5" "Pillow>=10,<12" "Pygments>=2.18,<3"
      - name: Verify script syntax
        run: |
          python -m py_compile scripts/publish_meanwhile.py scripts/build_toaster_part2_media.py
          php -l scripts/wp_publish_meanwhile.php
          php -l scripts/wp_verify_meanwhile_order.php
      - name: Test WordPress rate-limit cooldown logic
        run: python -m unittest discover -s tests -p 'test_publish_meanwhile_rate_limit.py'
      - name: Reproduce Part II performance and source-code images
        run: python scripts/build_toaster_part2_media.py
      - name: Validate post and all image references
        run: python scripts/publish_meanwhile.py --validate-only

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOUSY_SSH_HOST: ${{ secrets.LOUSY_SSH_HOST }}
      LOUSY_SSH_PORT: ${{ secrets.LOUSY_SSH_PORT }}
      LOUSY_SSH_USER: ${{ secrets.LOUSY_SSH_USER }}
      LOUSY_SSH_PASSWORD: ${{ secrets.LOUSY_SSH_PASSWORD }}
      LOUSY_SSH_KNOWN_HOSTS: ${{ secrets.LOUSY_SSH_KNOWN_HOSTS }}
      POST_SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publishing requirements
        run: pip install --disable-pip-version-check "Markdown>=3.7,<4" "PyYAML>=6,<7" "paramiko>=3.4,<5" "Pillow>=10,<12" "Pygments>=2.18,<3"
      - name: Select only the changed article for a push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          # A media-only commit must not reimport every published article.
          # Code-only or ambiguous multi-post pushes validate but do not publish.
          slug=""
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            mapfile -t changed_posts < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- 'content/meanwhile/*.md' | grep -v '/README.md$' || true)
            if [ "${#changed_posts[@]}" -eq 1 ]; then
              slug="$(sed -n 's/^slug: *//p' "${changed_posts[0]}" | head -n 1)"
            elif [ "${#changed_posts[@]}" -eq 0 ]; then
              mapfile -t changed_archives < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- 'content/meanwhile/media/*.zip' || true)
              if [ "${#changed_archives[@]}" -eq 1 ]; then
                slug="$(basename "${changed_archives[0]}" .zip)"
              fi
            fi
          fi
          if [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "POST_SLUG=$slug" >> "$GITHUB_ENV"
            echo "Publishing only changed article: $slug"
          else
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
            echo "No unambiguous changed article; skipping remote publication. Dispatch manually with a slug if needed."
          fi
      - name: Reproduce Part II performance and source-code images
        run: python scripts/build_toaster_part2_media.py
      - name: Validate publication inputs
        run: python scripts/publish_meanwhile.py --validate-only ${POST_SLUG:+--slug "$POST_SLUG"}
        shell: bash
      - name: Publish opted-in posts and photos
        if: env.SKIP_PUBLISH != 'true'
        run: python scripts/publish_meanwhile.py ${POST_SLUG:+--slug "$POST_SLUG"}
        shell: bash
