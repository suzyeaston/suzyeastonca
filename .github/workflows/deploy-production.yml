name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: What to deploy to production
        required: true
        default: both
        type: choice
        options:
          - both
          - theme
          - plugin

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      theme: ${{ steps.resolve.outputs.theme }}
      plugin: ${{ steps.resolve.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            theme:
              - '*.php'
              - 'page-lousy-outages.php'
              - 'page-lousy-outages-pricing.php'
              - 'page-lousy-outages-account.php'
              - 'style.css'
              - 'inc/**'
              - 'parts/**'
              - 'assets/css/**'
              - 'assets/js/**'
              - 'assets/brand/**'
              - 'assets/audio/**'
              - 'assets/data/**'
              - 'js/**'
              - 'scripts/deploy-lousy-outages-ssh.py'
              - 'scripts/theme_deploy_manifest.py'
            plugin:
              - 'lousy-outages/**'
              - 'dist/lousy-outages.zip'
              - 'dist/lousy-outages.zip.sha256'
              - 'dist/release-manifest.json'
              - 'scripts/build-lousy-outages-release.sh'

      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.deploy_target }}" in
              theme)
                echo "theme=true" >> "$GITHUB_OUTPUT"
                echo "plugin=false" >> "$GITHUB_OUTPUT"
                ;;
              plugin)
                echo "theme=false" >> "$GITHUB_OUTPUT"
                echo "plugin=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "theme=true" >> "$GITHUB_OUTPUT"
                echo "plugin=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "theme=${{ steps.filter.outputs.theme }}" >> "$GITHUB_OUTPUT"
            echo "plugin=${{ steps.filter.outputs.plugin }}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.theme == 'true' || needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    env:
      LOUSY_SSH_HOST: ${{ secrets.LOUSY_SSH_HOST }}
      LOUSY_SSH_PORT: ${{ secrets.LOUSY_SSH_PORT }}
      LOUSY_SSH_USER: ${{ secrets.LOUSY_SSH_USER }}
      LOUSY_SSH_PASSWORD: ${{ secrets.LOUSY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deploy secrets are configured
        run: |
          missing=()
          [ -z "$LOUSY_SSH_HOST" ] && missing+=("LOUSY_SSH_HOST")
          [ -z "$LOUSY_SSH_USER" ] && missing+=("LOUSY_SSH_USER")
          [ -z "$LOUSY_SSH_PASSWORD" ] && missing+=("LOUSY_SSH_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing deploy secrets::GitHub Actions cannot read .env.deploy.local. Add repository secrets: ${missing[*]}."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "Use the same values as your local .env.deploy.local (see docs/deploy-production.md)."
            exit 1
          fi
          if [ -z "$LOUSY_SSH_PORT" ]; then
            echo "LOUSY_SSH_PORT=22" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deploy dependencies
        run: pip install paramiko

      - name: Validate theme deploy manifest
        if: needs.changes.outputs.theme == 'true'
        run: python3 scripts/theme_deploy_manifest.py validate

      - name: Validate changed deployable theme files
        if: needs.changes.outputs.theme == 'true' && github.event_name == 'push'
        run: python3 scripts/theme_deploy_manifest.py validate --git-base ${{ github.event.before }}

      - name: Build plugin release ZIP
        if: needs.changes.outputs.plugin == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          scripts/build-lousy-outages-release.sh

      - name: Deploy theme files
        if: needs.changes.outputs.theme == 'true'
        run: python3 scripts/deploy-lousy-outages-ssh.py --theme

      - name: Deploy Lousy Outages plugin
        if: needs.changes.outputs.plugin == 'true'
        run: python3 scripts/deploy-lousy-outages-ssh.py --plugin
