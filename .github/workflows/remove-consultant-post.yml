name: Remove Consultant Blog Post

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-consultant-post.yml'

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      LOUSY_SSH_HOST: ${{ secrets.LOUSY_SSH_HOST }}
      LOUSY_SSH_PORT: ${{ secrets.LOUSY_SSH_PORT }}
      LOUSY_SSH_USER: ${{ secrets.LOUSY_SSH_USER }}
      LOUSY_SSH_PASSWORD: ${{ secrets.LOUSY_SSH_PASSWORD }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko
      - name: Trash exact WordPress post and purge cache
        shell: python
        run: |
          import os, paramiko
          host=os.environ['LOUSY_SSH_HOST']; user=os.environ['LOUSY_SSH_USER']; password=os.environ['LOUSY_SSH_PASSWORD']; port=int(os.environ.get('LOUSY_SSH_PORT') or 22)
          c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy()); c.connect(host, port=port, username=user, password=password, timeout=60)
          php = r'''cd /home/uquklkik/public_html && php -r 'require "wp-load.php"; $id=956; $p=get_post($id); if(!$p){fwrite(STDERR,"post 956 not found\n"); exit(2);} if($p->post_name!=="i-wanted-to-become-a-consultant-i-didnt-expect-it-to-start-like-this"){fwrite(STDERR,"slug mismatch: ".$p->post_name."\n"); exit(3);} $r=wp_trash_post($id); if(!$r && get_post_status($id)!=="trash"){fwrite(STDERR,"failed to trash post\n"); exit(4);} if(function_exists("do_action")){do_action("litespeed_purge_all");} echo "post_id=".$id." status=".get_post_status($id)." title=".get_the_title($id)."\n";' '''
          _,out,err=c.exec_command(php, timeout=120); code=out.channel.recv_exit_status(); stdout=out.read().decode(); stderr=err.read().decode(); print(stdout); print(stderr)
          if code != 0: c.close(); raise SystemExit(code)
          url='https://www.suzyeaston.ca/i-wanted-to-become-a-consultant-i-didnt-expect-it-to-start-like-this/'
          _,out,err=c.exec_command("curl -L -s -o /dev/null -w '%{http_code}\\n' " + url, timeout=60); code=out.channel.recv_exit_status(); print('public_http_status=' + out.read().decode().strip()); print(err.read().decode()); c.close(); raise SystemExit(code)
